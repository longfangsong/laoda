[package]
edition      = "2024"
name         = "laoda"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "laoda"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c6", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "multicast",
  "tcp",
  "udp",
] }
hick-embassy = "0.2"
# hick-embassy 没再导出这两个，直接依赖（alloc feature 开启 Name/ServiceRecords/ServiceSpec）
mdns-proto = { version = "0.3", default-features = false, features = ["alloc"] }
rand_core = { version = "0.10", default-features = false }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
# internal-heap-stats：开启 HeapStats::max_usage（峰值），crate::heap 周期上报
# 依赖它来定堆尺寸。代价是每次 alloc/free 多几条整数指令，本机分配极少可忽略。
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
esp-backtrace = { version = "0.19.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-sync     = "0.8.0"
embassy-time     = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32c6",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  # 不开 socket-icmp / socket-raw：本机只用 UDP/TCP（DHCP/DNS/SNTP/push/mDNS），
  # 且 ping 应答由 auto-icmp-echo-reply 控制、与 socket-icmp 无关（本来也没开）。
  "socket-dns",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
# no_std：设计文档 §3 已验证 default-features = false 可在 no_std 使用
time             = { version = "0.3", default-features = false }
embedded-graphics = "0.8.2"
font-consumer = { git = "https://github.com/longfangsong/embedded-graphics-font-maker" }
font-maker-core = { git = "https://github.com/longfangsong/embedded-graphics-font-maker" }
embedded-hal       = "1.0.0"
embedded-hal-async = "1.0.0"
embassy-embedded-hal = "0.6.0"

# TF 卡文件 IO（设计文档 §17）。四个 crate 同属 MabezDev/embedded-fatfs 仓库：
# embedded-fatfs 只在 crates.io 上占了个 0.0.0 的坑，真正的版本只发在 git 上；
# block-device-* 的已发布版本卡在 embedded-io-async 0.6，和 embedded-fatfs（0.7）
# 对不上，所以四个一起从同一个 rev 取，锁死 commit 保证可复现。
# embedded-fatfs 关掉默认 feature：chrono 要 std 时钟（时间由 device::tf 的
# TimeProvider 从 NTP 时钟取），unicode 只影响非 ASCII 文件名的大小写折叠，不值那点 flash。
# alloc 是开的：没有它 DirEntry::file_name() 不存在，且 LFN 缓冲会变成 500 多字节的栈数组。
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112", default-features = false, features = [
  "alloc",
  "lfn",
  "log",
] }
block-device-driver = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
block-device-adapters = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
embedded-partitions = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
aligned = "0.4.2"



# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
# 本地开发时使用本地 font-maker 仓库，改动无需先 push
[patch."https://github.com/longfangsong/embedded-graphics-font-maker"]
font-consumer   = { path = "../embedded-graphics-font-maker/font-consumer" }
font-maker-core = { path = "../embedded-graphics-font-maker/font-maker-core" }

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
